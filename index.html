<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YRC Lost & Found Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --yrc-pink: #e10098; --yrc-pink-dark: #b5007a; --dark: #2d3436; }
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { 
            background-image: linear-gradient(rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.6)), 
                              url('https://cdn.phototourl.com/uploads/2026-02-24-35dc78c2-07d5-409b-969d-35fb2cad1a46.jpg'); 
            background-size: cover; background-attachment: fixed; background-position: center;
            margin: 0; padding-top: 70px; min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, var(--yrc-pink), var(--yrc-pink-dark));
            color: white; padding: 15px; position: fixed; top: 0; width: 100%; z-index: 1000;
            display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .container {
            max-width: 500px; width: 92%; background: rgba(255, 255, 255, 0.95); padding: 35px 25px;
            border-radius: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin: 20px auto; text-align: center;
        }
        .hidden { display: none !important; }
        input, textarea {
            width: 100%; padding: 16px; border: 2px solid #edf2f7; border-radius: 18px;
            font-size: 16px; margin-bottom: 15px; outline: none; background: white;
        }
        input:focus, textarea:focus { border-color: var(--yrc-pink); }
        .btn {
            width: 100%; padding: 18px; border: none; border-radius: 20px; font-size: 18px;
            font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-pink { background: var(--yrc-pink); color: white; }
        .btn-dark { background: var(--dark); color: white; }
        .btn-success { background: #2ecc71; color: white; margin-top: 15px; font-size: 14px; padding: 10px; }
        
        .item-card {
            background: white; border-radius: 20px; padding: 18px; margin-bottom: 15px;
            text-align: left; border-left: 8px solid var(--yrc-pink); box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .spy-contact {
            background: #fff0f9; border: 1px dashed var(--yrc-pink);
            padding: 12px; border-radius: 12px; margin-top: 10px; color: var(--yrc-pink-dark);
        }
        .img-preview { width: 100%; border-radius: 20px; margin-bottom: 15px; display: none; object-fit: cover; max-height: 250px; }
        .required-star { color: red; }
    </style>
</head>
<body>

<header id="appHeader" class="hidden">
    <div style="display: flex; align-items: center; gap: 10px;">
        <img src="https://cdn.phototourl.com/uploads/2026-02-24-35dc78c2-07d5-409b-969d-35fb2cad1a46.jpg" style="height: 35px; width: 35px; border-radius: 50%; object-fit: cover; border: 2px solid white;">
        <div style="font-weight:600;">YRC LOST & FOUND</div>
    </div>
    <div onclick="window.location.reload()" style="cursor:pointer; font-size:14px; opacity:0.9;">ออกจากระบบ</div>
</header>

<div id="loginView" class="container">
    <img src="https://cdn.phototourl.com/uploads/2026-02-24-35dc78c2-07d5-409b-969d-35fb2cad1a46.jpg" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 20px; border: 4px solid var(--yrc-pink);">
    <h2>YRC Lost & Found</h2>
    <p style="color: #666; margin-bottom: 25px;">ระบบแจ้งของหายโรงเรียนยุพราชวิทยาลัย</p>
    <input type="text" id="userInput" placeholder="รหัสนักเรียน 5 หลัก / บัญชีครู">
    <input type="password" id="passInput" placeholder="รหัสผ่าน">
    <button class="btn btn-pink" onclick="doLogin()">เข้าสู่ระบบ</button>
</div>

<div id="homeView" class="container hidden">
    <h3 style="text-align: left; color: var(--yrc-pink);">สวัสดีคุณ <span id="userNameShow"></span></h3>
    <button class="btn btn-pink" style="height:120px; margin-bottom:20px;" onclick="goPage('formView')">📝 แจ้งทำของหายใหม่</button>
    <div id="adminArea" class="hidden">
        <hr style="border: 1px solid #eee; margin: 20px 0;">
        <button class="btn btn-dark" style="height:100px;" onclick="goPage('listView')">🔍 ดูรายการที่ได้รับแจ้ง (เจ้าหน้าที่)</button>
    </div>
</div>

<div id="formView" class="container hidden">
    <h3 style="margin-top: 0;">📝 แจ้งข้อมูลของหาย</h3>
    <p style="font-size: 13px; color: #666; margin-bottom: 15px;">กรุณากรอกข้อมูลให้ครบถ้วนทุกช่อง</p>
    
    <input type="text" id="f_item" placeholder="ชื่อสิ่งของที่หาย *">
    <input type="text" id="f_loc" placeholder="สถานที่ที่หาย *">
    <textarea id="f_desc" rows="3" placeholder="รายละเอียดลักษณะของสิ่งของ *"></textarea>
    
    <div style="text-align: left; margin-bottom: 15px;">
        <label style="font-size: 14px; color: #555;">📸 รูปภาพประกอบ (ถ้ามี):</label>
        <input type="file" accept="image/*" onchange="previewFile(this)" style="margin-top: 5px;">
        <img id="imgShow" class="img-preview">
    </div>

    <div style="background:#f0f7ff; padding:20px; border-radius:20px; text-align: left; border: 1px solid #d0e7ff;">
        <label style="font-weight: 600; color: #0056b3;">📞 ข้อมูลผู้แจ้ง (ครูใช้ติดต่อคืนของ)</label>
        <input type="text" id="f_name" placeholder="ชื่อ-นามสกุล จริง *" style="margin-top:10px;">
        <input type="tel" id="f_tel" placeholder="เบอร์โทรศัพท์ (10 หลัก) *" maxlength="10">
    </div>
    
    <button class="btn btn-pink" onclick="doSave()">ส่งข้อมูลแจ้งหาย</button>
    <button class="btn" onclick="goPage('homeView')">ย้อนกลับ</button>
</div>

<div id="listView" class="container hidden">
    <h3>📋 รายการแจ้งหาย (เจ้าหน้าที่)</h3>
    <div id="renderArea"></div>
    <button class="btn btn-dark" onclick="goPage('homeView')" style="margin-top: 20px;">กลับหน้าหลัก</button>
</div>

<script>
    let localDB = JSON.parse(localStorage.getItem('YRC_LOST_STRICT_V6') || '[]');
    let session = { role: '', name: '' };
    let tempImage = null;

    function goPage(id) {
        document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        document.getElementById('appHeader').classList.toggle('hidden', id === 'loginView');
        if(id === 'listView') renderData();
    }

    function doLogin() {
        const u = document.getElementById('userInput').value.trim();
        const p = document.getElementById('passInput').value.trim();
        if(u === "SPYyupparaj" && p === "yrcschool@120y") {
            session = { role: 'admin', name: 'เจ้าหน้าที่ สปย.' };
            document.getElementById('adminArea').classList.remove('hidden');
        } else if(u.length === 5) {
            session = { role: 'student', name: 'นักเรียน (' + u + ')' };
            document.getElementById('adminArea').classList.add('hidden');
        } else {
            alert("รหัสไม่ถูกต้อง"); return;
        }
        document.getElementById('userNameShow').innerText = session.name;
        goPage('homeView');
    }

    function previewFile(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { 
                tempImage = e.target.result;
                document.getElementById('imgShow').src = tempImage;
                document.getElementById('imgShow').style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function doSave() {
        // ดึงค่าจาก input
        const item = document.getElementById('f_item').value.trim();
        const loc = document.getElementById('f_loc').value.trim();
        const desc = document.getElementById('f_desc').value.trim();
        const name = document.getElementById('f_name').value.trim();
        const tel = document.getElementById('f_tel').value.trim();

        // 1. ตรวจสอบว่ากรอกครบทุกช่องไหม (ยกเว้นรูป)
        if(!item || !loc || !desc || !name || !tel) {
            alert("❌ กรุณากรอกข้อมูลให้ครบทุกช่องก่อนส่ง!");
            return;
        }

        // 2. ตรวจสอบเบอร์โทรศัพท์ (ต้องเป็นตัวเลขและครบ 10 หลัก)
        const telPattern = /^[0-9]{10}$/;
        if(!telPattern.test(tel)) {
            alert("❌ กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้องและครบ 10 หลัก (ตัวเลขเท่านั้น)");
            return;
        }

        // ถ้าผ่านทุกเงื่อนไข บันทึกข้อมูล
        const newData = {
            id: Date.now(),
            itemName: item,
            itemLoc: loc,
            itemDesc: desc,
            img: tempImage,
            uName: name,
            uTel: tel,
            time: new Date().toLocaleString('th-TH')
        };

        localDB.push(newData);
        localStorage.setItem('YRC_LOST_STRICT_V6', JSON.stringify(localDB));
        alert("✅ ส่งข้อมูลสำเร็จ! กรุณารอรับการติดต่อกลับจากครู สปย.");
        
        // ล้างข้อมูล
        document.getElementById('f_item').value = "";
        document.getElementById('f_loc').value = "";
        document.getElementById('f_desc').value = "";
        document.getElementById('f_name').value = "";
        document.getElementById('f_tel').value = "";
        document.getElementById('imgShow').style.display = "none";
        tempImage = null;
        
        goPage('homeView');
    }

    function deleteData(id) {
        if(confirm("ยืนยันว่าได้รับของคืนเรียบร้อยแล้ว?")) {
            localDB = localDB.filter(x => x.id !== id);
            localStorage.setItem('YRC_LOST_STRICT_V6', JSON.stringify(localDB));
            renderData();
        }
    }
function renderData() {
        const area = document.getElementById('renderArea');
        area.innerHTML = localDB.slice().reverse().map(i => `
            <div class="item-card">
                ${i.img ? `<img src="${i.img}" style="width:100%; border-radius:15px; margin-bottom:15px;">` : ''}
                <b style="color:var(--yrc-pink); font-size: 18px;">📦 ${i.itemName}</b><br>
                <div style="font-size: 14px; margin-top:5px;">📍 ที่หาย: ${i.itemLoc}</div>
                <div style="color:#666; font-size:14px; margin-top:5px;">📝 รายละเอียด: ${i.itemDesc}</div>
                <div class="spy-contact">
                    <b>ผู้แจ้ง:</b> ${i.uName}<br>
                    <b>เบอร์โทร:</b> ${i.uTel}<br>
                    <small>🕒 เมื่อ: ${i.time}</small>
                </div>
                <button class="btn btn-success" onclick="deleteData(${i.id})">✅ คืนของแล้ว (ลบออก)</button>
            </div>
        `).join('') || '<p style="color:#999; margin-top:20px;">ยังไม่มีรายการแจ้งหาย</p>';
    }
</script>
</body>
</html>
