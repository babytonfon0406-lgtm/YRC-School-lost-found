<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YRC Lost & Found Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --yrc-pink: #e10098; --yrc-pink-dark: #b5007a; --dark: #2d3436; }
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        
        body { 
            background-image: linear-gradient(rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.6)), 
                              url('https://cdn.phototourl.com/uploads/2026-02-24-35dc78c2-07d5-409b-969d-35fb2cad1a46.jpg'); 
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            margin: 0; 
            padding-top: 70px; 
            min-height: 100vh;
        }
        
        header {
            background: linear-gradient(135deg, var(--yrc-pink), var(--yrc-pink-dark));
            color: white; padding: 15px; position: fixed; top: 0; width: 100%; z-index: 1000;
            display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 500px; width: 92%; background: rgba(255, 255, 255, 0.95); padding: 35px 25px;
            border-radius: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin: 20px auto; text-align: center;
        }

        .hidden { display: none !important; }

        input, textarea {
            width: 100%; padding: 16px; border: 2px solid #edf2f7; border-radius: 18px;
            font-size: 16px; margin-bottom: 15px; outline: none; background: white;
        }

        .btn {
            width: 100%; padding: 18px; border: none; border-radius: 20px; font-size: 18px;
            font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-pink { background: var(--yrc-pink); color: white; }
        .btn-dark { background: var(--dark); color: white; }
        .btn-success { background: #2ecc71; color: white; margin-top: 15px; font-size: 14px; padding: 10px; }

        .item-card {
            background: white; border-radius: 20px; padding: 18px; margin-bottom: 15px;
            text-align: left; border-left: 8px solid var(--yrc-pink); box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .spy-contact {
            background: #fff0f9; border: 1px dashed var(--yrc-pink);
            padding: 12px; border-radius: 12px; margin-top: 10px; color: var(--yrc-pink-dark);
        }

        .img-preview { width: 100%; border-radius: 20px; margin-bottom: 15px; display: none; object-fit: cover; max-height: 250px; }
        
        .admin-only { border: 2px solid #ffd1e8; background: #fff9fc; }
    </style>
</head>
<body>

<header id="mainHeader" class="hidden">
    <div style="display: flex; align-items: center; gap: 10px;">
        <img src="https://cdn.phototourl.com/uploads/2026-02-24-35dc78c2-07d5-409b-969d-35fb2cad1a46.jpg" style="height: 35px; width: 35px; border-radius: 50%; object-fit: cover; border: 2px solid white;">
        <div style="font-weight:600;">YRC LOST & FOUND</div>
    </div>
    <div onclick="location.reload()" style="cursor:pointer; font-size:14px; opacity:0.9;">ออกจากระบบ</div>
</header>

<div id="loginPage" class="container">
    <img src="https://cdn.phototourl.com/uploads/2026-02-24-35dc78c2-07d5-409b-969d-35fb2cad1a46.jpg" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 20px; border: 4px solid var(--yrc-pink);">
    <h2>YRC Lost & Found</h2>
    <p style="color: #666; margin-bottom: 25px;">ระบบแจ้งของหายโรงเรียนยุพราชวิทยาลัย</p>
    <input type="text" id="loginID" placeholder="รหัสนักเรียน 5 หลัก / บัญชีครู">
    <input type="password" id="loginPass" placeholder="รหัสผ่าน">
    <button class="btn btn-pink" onclick="handleLoginNow()">เข้าสู่ระบบ</button>
</div>

<div id="homePage" class="container hidden">
    <h3 style="text-align: left; color: var(--yrc-pink);">สวัสดีคุณ <span id="userDisp"></span></h3>
    
    <button class="btn btn-pink" style="height:120px; margin-bottom:20px;" onclick="showSection('formPage')">📝 แจ้งทำของหายใหม่</button>
    
    <div id="adminMenu" class="hidden">
        <hr style="border: 1px solid #eee; margin: 20px 0;">
        <p style="font-size: 14px; color: #666;">เมนูสำหรับเจ้าหน้าที่ สปย.</p>
        <button class="btn btn-dark" style="height:100px;" onclick="showSection('listPage')">🔍 ดูรายการที่แจ้งหายทั้งหมด</button>
    </div>
</div>

<div id="formPage" class="container hidden">
    <h3>📝 รายละเอียดสิ่งของ</h3>
    <input type="text" id="itemName" placeholder="ชื่อสิ่งของที่หาย">
    <input type="text" id="itemLoc" placeholder="สถานที่คาดว่าหาย">
    <textarea id="itemDesc" rows="3" placeholder="รายละเอียดอื่นๆ"></textarea>
    
    <input type="file" accept="image/*" onchange="handlePreview(this)">
    <img id="imgView" class="img-preview">

    <div style="background:#f0f7ff; padding:20px; border-radius:20px; margin-top:10px; text-align: left;">
        <label style="font-weight: 600; color: #0056b3;">📞 ข้อมูลติดต่อ (เฉพาะ สปย. เห็น)</label>
        <input type="text" id="uName" placeholder="ชื่อ-นามสกุล" style="margin-top:10px;">
        <input type="tel" id="uTel" placeholder="เบอร์โทรศัพท์">
    </div>
    
    <button class="btn btn-pink" onclick="saveDataNow()">ส่งข้อมูลแจ้งหาย</button>
    <button class="btn" onclick="showSection('homePage')">ย้อนกลับ</button>
</div>

<div id="listPage" class="container hidden admin-only">
    <h3>📋 รายการแจ้งหาย (เจ้าหน้าที่)</h3>
    <div id="displayArea"></div>
    <button class="btn btn-dark" onclick="showSection('homePage')" style="margin-top: 20px;">กลับหน้าหลัก</button>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('yrc_final_storage_v3') || '[]');
    let userSession = null;
    let base64Data = null;

    function handleLoginNow() {
        const id = document.getElementById('loginID').value;
        const pw = document.getElementById('loginPass').value;
        
        if(id === "SPYyupparaj" && pw === "yrcschool@120y") {
            userSession = { role: 'admin', name: 'เจ้าหน้าที่ สปย.' };
            document.getElementById('adminMenu').classList.remove('hidden');
        } else if(id.length === 5) {
            userSession = { role: 'student', name: 'นักเรียน (' + id + ')' };
            document.getElementById('adminMenu').classList.add('hidden');
        } else { 
            return alert("รหัสผ่านไม่ถูกต้อง"); 
        }
        
        document.getElementById('userDisp').innerText = userSession.name;
        showSection('homePage');
    }

    function showSection(id) {
        // ป้องกันเด็กแอบเข้าหน้า List
        if(id === 'listPage' && userSession.role !== 'admin') {
            alert("สิทธิ์ไม่พอ: เฉพาะเจ้าหน้าที่เท่านั้นที่ดูได้");
            return;
        }

        document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        document.getElementById('mainHeader').classList.toggle('hidden', id === 'loginPage');
        if(id === 'listPage') renderList();
    }

    function handlePreview(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { 
                base64Data = e.target.result;
                document.getElementById('imgView').src = base64Data;
                document.getElementById('imgView').style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function saveDataNow() {
        const name = document.getElementById('itemName').value;
        const tel = document.getElementById('uTel').value;
        if(!name || !tel) return alert("กรุณากรอกชื่อของและเบอร์โทร");
        
        db.push({ 
            id: Date.now(), 
            name, 
            loc: document.getElementById('itemLoc').value, 
            desc: document.getElementById('itemDesc').value, 
            img: base64Data, 
            uName: document.getElementById('uName').value, 
            uTel: tel,
            date: new Date().toLocaleString('th-TH')
        });
        
        localStorage.setItem('yrc_final_storage_v3', JSON.stringify(db));
        alert("ส่งข้อมูลแจ้งหายเรียบร้อยแล้ว เจ้าหน้าที่จะรีบดำเนินการให้ครับ");
        
        // Reset Form
        document.getElementById('itemName').value = "";
        document.getElementById('uTel').value = "";
        base64Data = null;
        document.getElementById('imgView').style.display = 'none';
        
        showSection('homePage');
    }

    function deleteItem(id) {
        if(confirm("ยืนยันว่าเด็กมารับของเรียบร้อยแล้วใช่หรือไม่? รายการจะถูกลบออกจากระบบ")) {
            db = db.filter(item => item.id !== id);
            localStorage.setItem('yrc_final_storage_v3', JSON.stringify(db));
            renderList();
        }
    }

    function renderList() {
        const area = document.getElementById('displayArea');
        area.innerHTML = db.slice().reverse().map(i => `
            <div class="item-card">
                ${i.img ? <img src="${i.img}" style="width:100%; border-radius:15px; margin-bottom:15px;"> : ''}
                <b style="color:var(--yrc-pink); font-size: 18px;">📦 ${i.name}</b><br>
                <div style="margin-top: 8px; font-size: 14px;"><b>📍 สถานที่:</b> ${i.loc}</div>
                <div style="color: #666; font-size: 14px; margin-top: 5px;">${i.desc}</div>
                <div style="color: #999; font-size: 12px; margin-top: 5px;">🕒 เมื่อ: ${i.date}</div>
                <div class="spy-contact">
                <b>🔓 ข้อมูลติดต่อ:</b> ${i.uName} (${i.uTel})
                </div>
                <button class="btn btn-success" onclick="deleteItem(${i.id})">✅ เด็กมารับของแล้ว (ลบออก)</button>
            </div>
        `).join('') || '<p style="color:#999; margin-top:20px;">ยังไม่มีข้อมูลการแจ้งหาย</p>';
    }
</script>
</body>
</html>
