<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YRC Lost & Found Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --yrc-pink: #e10098; --yrc-pink-dark: #b5007a; --dark: #2d3436; --bg: #f7f9fc; }
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background-color: var(--bg); margin: 0; padding-top: 70px; }
        
        header {
            background: linear-gradient(135deg, var(--yrc-pink), var(--yrc-pink-dark));
            color: white; padding: 15px; position: fixed; top: 0; width: 100%; z-index: 1000;
            display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 500px; width: 92%; background: white; padding: 30px 20px;
            border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin: 20px auto; text-align: center;
        }

        .hidden { display: none !important; }

        input, textarea, select {
            width: 100%; padding: 15px; border: 2px solid #edf2f7; border-radius: 15px;
            font-size: 16px; margin-bottom: 12px; outline: none; background: #f8fafc;
        }

        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 15px; font-size: 17px;
            font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-pink { background: var(--yrc-pink); color: white; }
        .btn-dark { background: var(--dark); color: white; }

        .item-card {
            background: white; border-radius: 20px; padding: 15px; margin-bottom: 15px;
            text-align: left; border-left: 6px solid var(--yrc-pink); box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .spy-contact {
            background: #fff0f9; border: 1px dashed var(--yrc-pink);
            padding: 12px; border-radius: 12px; margin-top: 10px; color: var(--yrc-pink-dark);
        }

        .img-preview { width: 100%; border-radius: 15px; margin-bottom: 15px; display: none; object-fit: cover; max-height: 250px; }
    </style>
</head>
<body>

<header id="mainHeader" class="hidden">
    <div style="font-weight:600;">🌸 YRC LOST & FOUND</div>
    <div onclick="location.reload()" style="cursor:pointer; font-size:13px; opacity:0.8;">ออกจากระบบ</div>
</header>

<div id="loginPage" class="container">
    <img src="https://www.yrc.ac.th/wp-content/uploads/2019/03/yrc_logo.png" style="width: 80px; margin-bottom: 15px;">
    <h2>เข้าสู่ระบบแจ้งของหาย</h2>
    <input type="text" id="loginID" placeholder="รหัสนักเรียน 5 หลัก / บัญชีครู">
    <input type="password" id="loginPass" placeholder="รหัสผ่าน">
    <button class="btn btn-pink" onclick="handleLogin()">เข้าสู่ระบบ</button>
</div>

<div id="homePage" class="container hidden">
    <h3 id="userDisp">สวัสดี</h3>
    <button class="btn btn-pink" style="height:100px; margin-bottom:15px;" onclick="showSection('formPage')">📝 แจ้งทำของหายใหม่</button>
    <button class="btn btn-dark" style="height:100px;" onclick="showSection('listPage')">🔍 ดูประกาศทั้งหมด</button>
</div>

<div id="formPage" class="container hidden">
    <h3>📝 รายละเอียดสิ่งของ</h3>
    <input type="text" id="itemName" placeholder="ของที่หาย (เช่น กุญแจรถ)">
    <input type="text" id="itemLoc" placeholder="สถานที่คาดว่าหาย">
    <textarea id="itemDesc" placeholder="รายละเอียดอื่นๆ (สี, ยี่ห้อ)"></textarea>
    
    <label style="font-size:13px; display:block; text-align:left; margin-bottom:5px; color:#666;">📸 แนบรูปภาพ:</label>
    <input type="file" accept="image/*" onchange="previewImg(this)">
    <img id="imgView" class="img-preview">

    <div style="background:#f0f7ff; padding:15px; border-radius:15px; margin-top:10px;">
        <p style="margin:0 0 10px; font-weight:600; font-size:14px; color:#0056b3;">📞 ข้อมูลติดต่อ (ครูสปย.เห็นเท่านั้น)</p>
        <input type="text" id="uName" placeholder="ชื่อ-นามสกุลจริง">
        <input type="tel" id="uTel" placeholder="เบอร์โทรศัพท์">
    </div>
    
    <button class="btn btn-pink" onclick="saveData()">ส่งข้อมูลให้ สปย.</button>
    <button class="btn" onclick="showSection('homePage')">ยกเลิก</button>
</div>

<div id="listPage" class="container hidden">
    <h3>📋 รายการแจ้งหายล่าสุด</h3>
    <div id="displayArea"></div>
    <button class="btn btn-dark" onclick="showSection('homePage')">กลับหน้าหลัก</button>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('yrc_lost_db') || '[]');
    let currentUser = null;
    let base64Img = null;

    function handleLogin() {
        const id = document.getElementById('loginID').value;
        const pw = document.getElementById('loginPass').value;
        
        if(id === "SPYyupparaj" && pw === "yrcschool@120y") {
            currentUser = { role: 'admin', name: 'เจ้าหน้าที่ สปย.' };
        } else if(id.length === 5) {
            currentUser = { role: 'student', name: id };
        } else {
            return alert("รหัสผ่านไม่ถูกต้อง");
        }
        
        document.getElementById('userDisp').innerText = "ยินดีต้อนรับคุณ " + currentUser.name;
        showSection('homePage');
    }

    function showSection(id) {
        document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        document.getElementById('mainHeader').classList.toggle('hidden', id === 'loginPage');
        if(id === 'listPage') render();
    }

    function previewImg(input) {
        if (input.files && input.files[0]) {
            const r = new FileReader();
            r.onload = e => { 
                base64Img = e.target.result;
                document.getElementById('imgView').src = base64Img;
                document.getElementById('imgView').style.display = 'block';
            };
            r.readAsDataURL(input.files[0]);
        }
    }

    function saveData() {
        const name = document.getElementById('itemName').value;
        const tel = document.getElementById('uTel').value;
        if(!name || !tel) return alert("กรุณากรอกชื่อของและเบอร์โทร!");

        const item = {
            id: Date.now(),
            name: name,
            loc: document.getElementById('itemLoc').value,
            desc: document.getElementById('itemDesc').value,
            img: base64Img,
            uName: document.getElementById('uName').value,
            uTel: tel
        };

        db.push(item);
        localStorage.setItem('yrc_lost_db', JSON.stringify(db));
        alert("ส่งข้อมูลสำเร็จ!");
        showSection('homePage');
    }

    function render() {
        const area = document.getElementById('displayArea');
        area.innerHTML = db.slice().reverse().map(i => `
            <div class="item-card">
                ${i.img ? <img src="${i.img}" style="width:100%; border-radius:10px; margin-bottom:10px;"> : ''}
                <b style="color:var(--yrc-pink); font-size:18px;">📦 ${i.name}</b><br>
                <small>📍 สถานที่: ${i.loc}</small>
                <p style="font-size:14px; color:#666; margin:5px 0;">${i.desc}</p>
                ${currentUser.role === 'admin' ? `
                    <div class="spy-contact">
                        <b>🔒 ข้อมูลสำหรับ สปย.</b><br>
                        ผู้แจ้ง: ${i.uName}<br>
                        โทร: <a href="tel:${i.uTel}">${i.uTel}</a>
                    </div>
                ` : '<p style="font-size:11px; color:#999;">* ข้อมูลติดต่อเป็นความลับเฉพาะ สปย.</p>'}
            </div>
        `).join('') || 'ไม่มีข้อมูลการแจ้งหาย';
    }
</script>
</body>
</html>
